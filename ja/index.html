    <h1>Frameback</h1>
    <p class="tagline">同じ角度から、時間の変化を撮り続ける。</p>
  </header>

  <p>Framebackは、定点写真の記録をつくるためのアプリです。基準となる1枚からプロジェクトを始めると、
  次に撮るときは重ね合わせオーバーレイがその1枚をファインダーに重ねて表示します。
  同じ位置に立って合わせるだけ。「ビフォー &amp; アフター」で見比べ、そのまま動画に書き出せます。</p>

  <p>プロジェクトのデータと撮影した写真は、すべて端末内に保存されます。アカウント登録は必要ありません。</p>
